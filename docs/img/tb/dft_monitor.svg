<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 1930 1020" width="1930" height="1020" font-family="Helvetica, Arial, sans-serif" font-size="17">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .w    { stroke:#374151; stroke-width:1.6; fill:none; }
      .bus  { stroke:#374151; stroke-width:3;   fill:none; }
      .inst { fill:#f8fafc; stroke:#334155; stroke-width:1.8; }
      .chk  { fill:#ffffff; stroke:#334155; stroke-width:2.2; }
      .comb { fill:#f3f4f6; stroke:#6b7280; stroke-width:1.6; }
      .mod  { fill:none; stroke:#9ca3af; stroke-width:1.4; stroke-dasharray:6 4; }
      .modl { fill:#6b7280; font-size:16px; font-family:Menlo, Consolas, monospace; }
      .bm   { fill:#111827; font-weight:bold; font-family:Menlo, Consolas, monospace; font-size:15px; }
      .code { fill:#374151; font-family:Menlo, Consolas, monospace; font-size:15px; }
      .small{ fill:#374151; font-family:Menlo, Consolas, monospace; font-size:14px; }
      .net  { fill:#7c2d12; font-family:Menlo, Consolas, monospace; font-size:15px; }
      .port { fill:#1e3a8a; font-family:Menlo, Consolas, monospace; font-size:15px; }
      .pin  { fill:#111827; font-family:Menlo, Consolas, monospace; font-size:17px; font-weight:bold; }
    </style>
  </defs>
  <rect x="-30" width="1930" height="1020" fill="#ffffff"/>
  <rect x="110" y="30" width="1770" height="970" rx="8" class="mod"/>
  <text x="118" y="48" class="modl">dft_mon : dft_monitor</text>
  <rect x="160" y="70" width="635" height="124" class="comb"/>
  <text x="174" y="96" class="bm">class dft_monitor extends uvm_monitor;</text>
  <text x="174" y="118" class="code">virtual dft_if  vif;     build_phase: vif  &lt;- config_db "dft_vif"</text>
  <text x="174" y="140" class="code">virtual jtag_if jvif;    build_phase: jvif &lt;- config_db "jtag_vif"</text>
  <text x="174" y="162" class="code">uvm_analysis_port #(dft_txn) ap;</text>
  <text x="174" y="184" class="code">int unsigned cycle;</text>
  <rect x="1874" y="114" width="12" height="12" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="1866" y="125" class="port" text-anchor="end">ap</text>
  <text x="160" y="260" class="bm">task run_phase</text>
  <path d="M230,280 H1860" class="bus"/>
  <text x="178" y="286" class="bm">fork</text>
  <rect x="270" y="310" width="260" height="40" rx="6" class="comb"/>
  <text x="284" y="335" class="code">@(vif.mon_cb);</text>
  <path d="M400,350 V380" class="w" marker-end="url(#arr)"/>
  <rect x="270" y="380" width="260" height="40" rx="6" class="comb"/>
  <text x="284" y="405" class="code">cycle++;</text>
  <path d="M400,420 V450" class="w" marker-end="url(#arr)"/>
  <rect x="270" y="450" width="260" height="40" rx="6" class="comb"/>
  <text x="284" y="475" class="code">sample();</text>
  <path d="M400,490 V520 H220 V330 H270" class="w" marker-end="url(#arr)"/>
  <text x="214" y="420" class="net" text-anchor="end">forever</text>
  <rect x="732" y="310" width="497" height="40" rx="6" class="comb"/>
  <text x="746" y="335" class="code">@(vif.test_mode or vif.scan_en or vif.mbist_start);</text>
  <path d="M980,350 V390" class="w" marker-end="url(#arr)"/>
  <path d="M810,390 H1150 L1180,450 L1150,510 H810 L780,450 Z" class="comb"/>
  <text x="980" y="435" class="code" text-anchor="middle">(jvif.tck === 1'b1 ||</text>
  <text x="980" y="455" class="code" text-anchor="middle" xml:space="preserve"> jvif.tck_en === 1'b0) &amp;&amp;</text>
  <text x="980" y="475" class="code" text-anchor="middle" xml:space="preserve"> jvif.trst_n === 1'b1</text>
  <path d="M980,510 V550" class="w" marker-end="url(#arr)"/>
  <text x="990" y="534" class="net">yes</text>
  <rect x="865" y="550" width="230" height="80" rx="6" class="comb"/>
  <text x="879" y="575" class="code">`uvm_error("DFT_EDGE",</text>
  <text x="879" y="595" class="code" xml:space="preserve">  "DFT output changed</text>
  <text x="879" y="615" class="code" xml:space="preserve">   while TCK is ...")</text>
  <path d="M780,450 H690" class="w"/>
  <text x="700" y="440" class="net">no</text>
  <circle cx="690" cy="450" r="4" fill="#374151"/>
  <path d="M980,630 V660 H690 V330 H732" class="w" marker-end="url(#arr)"/>
  <text x="684" y="510" class="net" text-anchor="end">forever</text>
  <rect x="1421" y="310" width="359" height="40" rx="6" class="comb"/>
  <text x="1435" y="335" class="code">@(vif.mbist_done or vif.mbist_pass);</text>
  <path d="M1600,350 V390" class="w" marker-end="url(#arr)"/>
  <path d="M1450,390 H1750 L1780,440 L1750,490 H1450 L1420,440 Z" class="comb"/>
  <text x="1600" y="435" class="code" text-anchor="middle">jvif.tck_en === 1'b0 &amp;&amp;</text>
  <text x="1600" y="455" class="code" text-anchor="middle">jvif.trst_n === 1'b1</text>
  <path d="M1600,490 V530" class="w" marker-end="url(#arr)"/>
  <text x="1610" y="514" class="net">yes</text>
  <rect x="1472" y="530" width="257" height="80" rx="6" class="comb"/>
  <text x="1486" y="555" class="code">`uvm_error("DFT_EDGE",</text>
  <text x="1486" y="575" class="code" xml:space="preserve">  "MBIST status changed</text>
  <text x="1486" y="595" class="code" xml:space="preserve">   while TCK is stopped")</text>
  <path d="M1420,440 H1370" class="w"/>
  <text x="1380" y="430" class="net">no</text>
  <circle cx="1370" cy="440" r="4" fill="#374151"/>
  <path d="M1600,610 V640 H1370 V330 H1421" class="w" marker-end="url(#arr)"/>
  <text x="1364" y="500" class="net" text-anchor="end">forever</text>
  <path d="M230,710 H1860" class="bus"/>
  <text x="178" y="716" class="bm">join</text>
  <rect x="160" y="750" width="423" height="234" class="comb"/>
  <text x="174" y="776" class="bm">function void sample();</text>
  <text x="174" y="798" class="code" xml:space="preserve">  t = dft_txn::type_id::create("t");</text>
  <text x="174" y="820" class="code" xml:space="preserve">  t.cycle        = cycle;</text>
  <text x="174" y="842" class="code" xml:space="preserve">  t.test_mode    = vif.mon_cb.test_mode;</text>
  <text x="174" y="864" class="code" xml:space="preserve">  t.scan_en      = vif.mon_cb.scan_en;</text>
  <text x="174" y="886" class="code" xml:space="preserve">  t.mbist_start  = vif.mon_cb.mbist_start;</text>
  <text x="174" y="908" class="code" xml:space="preserve">  t.mbist_done   = vif.mon_cb.mbist_done;</text>
  <text x="174" y="930" class="code" xml:space="preserve">  t.mbist_pass   = vif.mon_cb.mbist_pass;</text>
  <text x="174" y="952" class="code" xml:space="preserve">  t.mbist_fail_i = vif.mon_cb.mbist_fail_i;</text>
  <text x="174" y="974" class="code" xml:space="preserve">  ap.write(t);</text>
</svg>
