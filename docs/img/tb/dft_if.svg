<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 1330 630" width="1330" height="630" font-family="Helvetica, Arial, sans-serif" font-size="17">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .w    { stroke:#374151; stroke-width:1.6; fill:none; }
      .bus  { stroke:#374151; stroke-width:3;   fill:none; }
      .inst { fill:#f8fafc; stroke:#334155; stroke-width:1.8; }
      .chk  { fill:#ffffff; stroke:#334155; stroke-width:2.2; }
      .comb { fill:#f3f4f6; stroke:#6b7280; stroke-width:1.6; }
      .mod  { fill:none; stroke:#9ca3af; stroke-width:1.4; stroke-dasharray:6 4; }
      .modl { fill:#6b7280; font-size:16px; font-family:Menlo, Consolas, monospace; }
      .bm   { fill:#111827; font-weight:bold; font-family:Menlo, Consolas, monospace; font-size:15px; }
      .code { fill:#374151; font-family:Menlo, Consolas, monospace; font-size:15px; }
      .small{ fill:#374151; font-family:Menlo, Consolas, monospace; font-size:14px; }
      .net  { fill:#7c2d12; font-family:Menlo, Consolas, monospace; font-size:15px; }
      .port { fill:#1e3a8a; font-family:Menlo, Consolas, monospace; font-size:15px; }
      .pin  { fill:#111827; font-family:Menlo, Consolas, monospace; font-size:17px; font-weight:bold; }
    </style>
  </defs>
  <rect x="-30" width="1330" height="630" fill="#ffffff"/>
  <rect x="110" y="30" width="1170" height="580" rx="8" class="mod"/>
  <text x="118" y="48" class="modl">interface dft_if (input logic tck);</text>
  <text x="200" y="155" class="code">input logic</text>
  <text x="420" y="155" class="bm">tck</text>
  <text x="200" y="195" class="code">logic</text>
  <text x="420" y="195" class="bm">test_mode</text>
  <text x="200" y="235" class="code">logic</text>
  <text x="420" y="235" class="bm">scan_en</text>
  <text x="200" y="275" class="code">logic</text>
  <text x="420" y="275" class="bm">mbist_start</text>
  <text x="200" y="315" class="code">logic</text>
  <text x="420" y="315" class="bm">mbist_done</text>
  <text x="200" y="355" class="code">logic</text>
  <text x="420" y="355" class="bm">mbist_pass</text>
  <text x="200" y="395" class="code">logic</text>
  <text x="420" y="395" class="bm">mbist_fail_i</text>
  <rect x="680" y="120" width="340" height="320" rx="6" class="inst"/>
  <text x="850" y="144" class="bm" text-anchor="middle">clocking mon_cb @(posedge tck);</text>
  <text x="850" y="426" class="code" text-anchor="middle">default input #1step;</text>
  <path d="M680,162 L692,170 L680,178" fill="none" stroke="#334155" stroke-width="1.6"/>
  <path d="M520,150 H600 V170 H680" class="w" marker-end="url(#arr)"/>
  <path d="M560,190 H680" class="w" marker-end="url(#arr)"/>
  <text x="690" y="195" class="port">input test_mode</text>
  <path d="M1020,190 H1080" class="w"/>
  <text x="1086" y="195" class="net">mon_cb.test_mode</text>
  <path d="M560,230 H680" class="w" marker-end="url(#arr)"/>
  <text x="690" y="235" class="port">input scan_en</text>
  <path d="M1020,230 H1080" class="w"/>
  <text x="1086" y="235" class="net">mon_cb.scan_en</text>
  <path d="M560,270 H680" class="w" marker-end="url(#arr)"/>
  <text x="690" y="275" class="port">input mbist_start</text>
  <path d="M1020,270 H1080" class="w"/>
  <text x="1086" y="275" class="net">mon_cb.mbist_start</text>
  <path d="M560,310 H680" class="w" marker-end="url(#arr)"/>
  <text x="690" y="315" class="port">input mbist_done</text>
  <path d="M1020,310 H1080" class="w"/>
  <text x="1086" y="315" class="net">mon_cb.mbist_done</text>
  <path d="M560,350 H680" class="w" marker-end="url(#arr)"/>
  <text x="690" y="355" class="port">input mbist_pass</text>
  <path d="M1020,350 H1080" class="w"/>
  <text x="1086" y="355" class="net">mon_cb.mbist_pass</text>
  <path d="M560,390 H680" class="w" marker-end="url(#arr)"/>
  <text x="690" y="395" class="port">input mbist_fail_i</text>
  <path d="M1020,390 H1080" class="w"/>
  <text x="1086" y="395" class="net">mon_cb.mbist_fail_i</text>
  <text x="200" y="505" class="code">clocking mon_cb @(posedge tck);</text>
  <text x="200" y="525" class="code" xml:space="preserve">  default input #1step;</text>
  <text x="200" y="545" class="code" xml:space="preserve">  input test_mode, scan_en, mbist_start, mbist_done, mbist_pass, mbist_fail_i;</text>
  <text x="200" y="565" class="code">endclocking</text>
</svg>
