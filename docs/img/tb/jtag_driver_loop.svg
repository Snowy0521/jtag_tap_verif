<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 1650 1130" width="1650" height="1130" font-family="Helvetica, Arial, sans-serif" font-size="17">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .w    { stroke:#374151; stroke-width:1.6; fill:none; }
      .bus  { stroke:#374151; stroke-width:3;   fill:none; }
      .inst { fill:#f8fafc; stroke:#334155; stroke-width:1.8; }
      .chk  { fill:#ffffff; stroke:#334155; stroke-width:2.2; }
      .comb { fill:#f3f4f6; stroke:#6b7280; stroke-width:1.6; }
      .mod  { fill:none; stroke:#9ca3af; stroke-width:1.4; stroke-dasharray:6 4; }
      .modl { fill:#6b7280; font-size:16px; font-family:Menlo, Consolas, monospace; }
      .bm   { fill:#111827; font-weight:bold; font-family:Menlo, Consolas, monospace; font-size:15px; }
      .code { fill:#374151; font-family:Menlo, Consolas, monospace; font-size:15px; }
      .small{ fill:#374151; font-family:Menlo, Consolas, monospace; font-size:14px; }
      .net  { fill:#7c2d12; font-family:Menlo, Consolas, monospace; font-size:15px; }
      .port { fill:#1e3a8a; font-family:Menlo, Consolas, monospace; font-size:15px; }
      .pin  { fill:#111827; font-family:Menlo, Consolas, monospace; font-size:17px; font-weight:bold; }
    </style>
  </defs>
  <rect x="-30" width="1650" height="1130" fill="#ffffff"/>
  <rect x="110" y="30" width="1490" height="1080" rx="8" class="mod"/>
  <text x="118" y="48" class="modl">jtag_driver (1/2): run_phase and tick()</text>
  <rect x="200" y="70" width="690" height="102" class="comb"/>
  <text x="214" y="96" class="bm">class jtag_driver extends uvm_driver #(jtag_seq_item);</text>
  <text x="214" y="118" class="code">virtual jtag_if vif;            build_phase: vif &lt;- config_db "jtag_vif"</text>
  <text x="214" y="140" class="code">int unsigned    n_scans, n_tms_paths;</text>
  <text x="214" y="162" class="code">bit             at_rti;         // TAP known to be in Run-Test/Idle</text>
  <text x="200" y="235" class="bm">task run_phase</text>
  <rect x="250" y="250" width="640" height="40" rx="6" class="comb"/>
  <text x="264" y="274" class="code">vif.tms &lt;= 1'b1;  vif.tdi &lt;= 1'b0;  vif.trst_n &lt;= 1'b1;  vif.tck_en &lt;= 1'b1;</text>
  <path d="M560,290 V340" class="w" marker-end="url(#arr)"/>
  <rect x="360" y="340" width="400" height="40" rx="6" class="comb"/>
  <text x="374" y="364" class="code">seq_item_port.get_next_item(req);</text>
  <path d="M560,380 V420" class="w" marker-end="url(#arr)"/>
  <path d="M390,420 H730 L760,470 L730,520 H390 L360,470 Z" class="comb"/>
  <text x="560" y="455" class="code" text-anchor="middle">!at_rti &amp;&amp;</text>
  <text x="560" y="475" class="code" text-anchor="middle">!(req.kind inside</text>
  <text x="560" y="495" class="code" text-anchor="middle">{RESET_TRST, RESET_TMS})</text>
  <path d="M760,470 H850" class="w" marker-end="url(#arr)"/>
  <text x="805" y="460" class="net" text-anchor="middle">yes</text>
  <rect x="850" y="445" width="390" height="50" rx="6" class="comb"/>
  <text x="864" y="469" class="code">`uvm_fatal("DRV", "... send a reset first")</text>
  <path d="M560,520 V560" class="w" marker-end="url(#arr)"/>
  <text x="570" y="545" class="net">no</text>
  <text x="560" y="580" class="bm" text-anchor="middle">case (req.kind)</text>
  <path d="M260,600 H560 M260,600 V956" class="w"/>
  <path d="M560,590 V600" class="w"/>
  <path d="M260,620 H300" class="w" marker-end="url(#arr)"/>
  <rect x="300" y="602" width="190" height="36" class="comb"/>
  <text x="395" y="625" class="bm" text-anchor="middle">RESET_TRST</text>
  <path d="M490,620 H560" class="w" marker-end="url(#arr)"/>
  <rect x="560" y="600" width="420" height="40" rx="6" class="comb"/>
  <text x="574" y="624" class="code">reset_trst(req.trst_short);</text>
  <path d="M980,620 H1030" class="w"/>
  <path d="M260,676 H300" class="w" marker-end="url(#arr)"/>
  <rect x="300" y="658" width="190" height="36" class="comb"/>
  <text x="395" y="681" class="bm" text-anchor="middle">TMS_PATH</text>
  <path d="M490,676 H560" class="w" marker-end="url(#arr)"/>
  <rect x="560" y="656" width="420" height="40" rx="6" class="comb"/>
  <text x="574" y="680" class="code">tms_path(req.tms_q);</text>
  <path d="M980,676 H1030" class="w"/>
  <path d="M260,732 H300" class="w" marker-end="url(#arr)"/>
  <rect x="300" y="714" width="190" height="36" class="comb"/>
  <text x="395" y="737" class="bm" text-anchor="middle">RESET_TMS</text>
  <path d="M490,732 H560" class="w" marker-end="url(#arr)"/>
  <rect x="560" y="712" width="420" height="40" rx="6" class="comb"/>
  <text x="574" y="736" class="code">reset_tms();</text>
  <path d="M980,732 H1030" class="w"/>
  <path d="M260,788 H300" class="w" marker-end="url(#arr)"/>
  <rect x="300" y="770" width="190" height="36" class="comb"/>
  <text x="395" y="793" class="bm" text-anchor="middle">IDLE</text>
  <path d="M490,788 H560" class="w" marker-end="url(#arr)"/>
  <rect x="560" y="768" width="420" height="40" rx="6" class="comb"/>
  <text x="574" y="792" class="code">repeat (req.idle_cycles) tick(1'b0);</text>
  <path d="M980,788 H1030" class="w"/>
  <path d="M260,844 H300" class="w" marker-end="url(#arr)"/>
  <rect x="300" y="826" width="190" height="36" class="comb"/>
  <text x="395" y="849" class="bm" text-anchor="middle">TCK_STOP</text>
  <path d="M490,844 H560" class="w" marker-end="url(#arr)"/>
  <rect x="560" y="824" width="420" height="40" rx="6" class="comb"/>
  <text x="574" y="848" class="code">tck_stop(req.idle_cycles);</text>
  <path d="M980,844 H1030" class="w"/>
  <path d="M260,900 H300" class="w" marker-end="url(#arr)"/>
  <rect x="300" y="882" width="190" height="36" class="comb"/>
  <text x="395" y="905" class="bm" text-anchor="middle">IR_SCAN</text>
  <path d="M490,900 H560" class="w" marker-end="url(#arr)"/>
  <rect x="560" y="880" width="420" height="40" rx="6" class="comb"/>
  <text x="574" y="904" class="code">scan(1'b1, req);  n_scans++;</text>
  <path d="M980,900 H1030" class="w"/>
  <path d="M260,956 H300" class="w" marker-end="url(#arr)"/>
  <rect x="300" y="938" width="190" height="36" class="comb"/>
  <text x="395" y="961" class="bm" text-anchor="middle">DR_SCAN</text>
  <path d="M490,956 H560" class="w" marker-end="url(#arr)"/>
  <rect x="560" y="936" width="420" height="40" rx="6" class="comb"/>
  <text x="574" y="960" class="code">scan(1'b0, req);  n_scans++;</text>
  <path d="M980,956 H1030" class="w"/>
  <path d="M1030,620 V1016 H560 V1046" class="w" marker-end="url(#arr)"/>
  <rect x="360" y="1046" width="400" height="40" rx="6" class="comb"/>
  <text x="374" y="1070" class="code">seq_item_port.item_done();</text>
  <path d="M360,1066 H220 V360 H360" class="w" marker-end="url(#arr)"/>
  <text x="212" y="700" class="net" text-anchor="end">forever</text>
  <rect x="1150" y="230" width="350" height="124" class="comb"/>
  <text x="1164" y="256" class="bm">task tick(bit tms, bit tdi = 1'b0);</text>
  <text x="1164" y="278" class="code" xml:space="preserve">  @(negedge vif.tck);</text>
  <text x="1164" y="300" class="code" xml:space="preserve">  vif.tms &lt;= tms;</text>
  <text x="1164" y="322" class="code" xml:space="preserve">  vif.tdi &lt;= tdi;</text>
  <text x="1164" y="344" class="code">endtask</text>
  <text x="1158" y="525" class="pin" text-anchor="end">tck</text>
  <text x="1158" y="595" class="pin" text-anchor="end">tms</text>
  <text x="1158" y="665" class="pin" text-anchor="end">tdi</text>
  <path d="M1170,535 H1230 V505 H1290 V535 H1350 V505 H1410 V535 H1470 V505 H1530 V535" class="w"/>
  <path d="M1170,605 H1292 V575 H1412 V605 H1530" class="w"/>
  <path d="M1170,645 H1292 V675 H1412 H1530" class="w"/>
  <path d="M1290,485 V685" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>
  <path d="M1410,485 V685" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>
  <path d="M1230,485 V685" stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M1350,485 V685" stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <path d="M1470,485 V685" stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="2 4" fill="none"/>
  <text x="1350" y="475" class="net" text-anchor="middle">tick(): drive at negedge</text>
  <text x="1350" y="710" class="port" text-anchor="middle">DUT samples at posedge</text>
</svg>
