  <rect x="160" y="70" width="828" height="322" class="comb"/>
  <text x="174" y="96" class="bm">class jtag_base_test extends uvm_test;</text>
  <text x="174" y="118" class="code">jtag_env       env;</text>
  <text x="174" y="140" class="code">virtual dft_if dvif;</text>
  <text x="174" y="162" class="code">function void build_phase(uvm_phase phase);</text>
  <text x="174" y="184" class="code" xml:space="preserve">  env = jtag_env::type_id::create("env", this);</text>
  <text x="174" y="206" class="code" xml:space="preserve">  if (!uvm_config_db #(virtual dft_if)::get(this, "", "dft_vif", dvif)) `uvm_fatal(...)</text>
  <text x="174" y="228" class="code" xml:space="preserve">  uvm_top.set_timeout(10ms, 0);</text>
  <text x="174" y="250" class="code">task run_phase(uvm_phase phase);</text>
  <text x="174" y="272" class="code" xml:space="preserve">  phase.raise_objection(this);</text>
  <text x="174" y="294" class="code" xml:space="preserve">  phase.get_objection().set_drain_time(this, 10 * TCK_PERIOD_NS * 1ns);</text>
  <text x="174" y="316" class="code" xml:space="preserve">  run_stimulus();</text>
  <text x="174" y="338" class="code" xml:space="preserve">  phase.drop_objection(this);</text>
  <text x="174" y="360" class="code">virtual task run_stimulus();</text>
  <text x="174" y="382" class="code">endtask</text>
  <rect x="1100" y="120" width="230" height="40" class="comb"/>
  <text x="1215" y="145" class="small" text-anchor="middle">raise_objection</text>
  <rect x="1100" y="190" width="230" height="40" class="comb"/>
  <text x="1215" y="215" class="small" text-anchor="middle">run_stimulus()</text>
  <path d="M1215,160 V190" class="w" marker-end="url(#arr)"/>
  <rect x="1100" y="260" width="230" height="40" class="comb"/>
  <text x="1215" y="285" class="small" text-anchor="middle">drop_objection</text>
  <path d="M1215,230 V260" class="w" marker-end="url(#arr)"/>
  <rect x="1100" y="330" width="230" height="40" class="comb"/>
  <text x="1215" y="355" class="small" text-anchor="middle">drain time</text>
