  <path d="M75,262 H710 V215" class="w"/>
  <circle cx="710" cy="210" r="5" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="720" y="240" class="code">reset value 4'hF = TEST_LOGIC_RESET</text>

