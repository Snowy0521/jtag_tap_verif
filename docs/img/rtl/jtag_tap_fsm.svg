  <text x="410" y="135" class="code" text-anchor="middle">always_comb</text>
  <text x="410" y="151" class="code" text-anchor="middle">unique case (state)</text>
  <text x="410" y="167" class="code" text-anchor="middle">default: TEST_LOGIC_RESET</text>
  <text x="306" y="144" class="port">tms</text>

  <text x="-15" y="144" class="pin">tms</text>
  <path d="M60,140 H300" class="w" marker-end="url(#arr)"/>

  <!-- state_next -->
  <path d="M520,140 H640" class="bus" marker-end="url(#arrb)"/>
  <text x="530" y="132" class="sig">state_next</text>

  <!-- state register -->
  <rect x="640" y="95" width="140" height="110" class="inst"/>
  <text x="710" y="116" class="b" text-anchor="middle">state [3:0]</text>
  <text x="710" y="137" class="code" text-anchor="middle">posedge tck</text>
  <text x="710" y="176" class="code" text-anchor="middle">negedge trst_n</text>
  <text x="646" y="144" class="port">D</text>
  <text x="774" y="144" class="port" text-anchor="end">Q</text>
  <path d="M640,186 L652,193 L640,200" fill="none" stroke="#334155" stroke-width="1.6"/>

