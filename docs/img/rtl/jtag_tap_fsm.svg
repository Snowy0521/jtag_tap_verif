<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 1140 1100" width="1140" height="1100" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .w    { stroke:#374151; stroke-width:1.6; fill:none; }
      .bus  { stroke:#374151; stroke-width:3;   fill:none; }
      .inst { fill:#f8fafc; stroke:#334155; stroke-width:1.8; }
      .comb { fill:#f3f4f6; stroke:#6b7280; stroke-width:1.6; }
      .mod  { fill:none; stroke:#9ca3af; stroke-width:1.4; stroke-dasharray:6 4; }
      .modl { fill:#6b7280; font-size:14px; font-family:Menlo, Consolas, monospace; }
      .b    { fill:#111827; font-weight:bold; }
      .bm   { fill:#111827; font-weight:bold; font-family:Menlo, Consolas, monospace; font-size:14px; }
      .code { fill:#374151; font-family:Menlo, Consolas, monospace; font-size:13px; }
      .enc  { fill:#1d4ed8; font-family:Menlo, Consolas, monospace; font-size:13px; }
      .port { fill:#1e3a8a; font-family:Menlo, Consolas, monospace; font-size:13px; }
      .sig  { fill:#111827; font-family:Menlo, Consolas, monospace; font-size:14px; }
      .pin  { fill:#111827; font-family:Menlo, Consolas, monospace; font-size:15px; font-weight:bold; }
      .tms  { fill:#b91c1c; font-family:Menlo, Consolas, monospace; font-size:14px; font-weight:bold; }
    </style>
  </defs>
  <rect x="-30" width="1140" height="1100" fill="#ffffff"/>

  <rect x="110" y="30" width="890" height="255" rx="8" class="mod"/>
